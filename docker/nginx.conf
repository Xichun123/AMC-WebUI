server {
  listen 80;
  server_name _;
  absolute_redirect off;
  client_max_body_size 0;
  root /usr/share/nginx/html;
  index index.html;

  location = /api/auth/check {
    internal;
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
  }

  location = /api/auth/login {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/session {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    auth_request /api/auth/check;
    error_page 401 = @auth_json;

    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;
  }

  location = /login {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~ ^/(favicon\.png|apple-touch-icon\.png|pwa-192\.png|pwa-512\.png|pwa-512-maskable\.png|sidebar-logo\.png|sidebar-logo-dark\.png|about-logo\.png|about-logo-dark\.png|manifest\.json)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~ \.mjs$ {
    types {
      application/javascript mjs;
    }
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    auth_request /api/auth/check;
    error_page 401 = @login_redirect;

    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location @auth_json {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 401 '{"error":"AUTH_REQUIRED"}';
  }

  location @login_redirect {
    return 302 /login?next=$request_uri;
  }
}
